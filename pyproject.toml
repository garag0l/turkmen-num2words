[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "turkmen-num2words"
dynamic = ["version"]
description = "Convert integers to Turkmen (Latin) cardinal-number words."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Murat Bekgi" }]
keywords = ["turkmen", "turkmenistan", "numbers", "num2words", "nlp", "spellout"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Turkish",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/garag0l/turkmen-num2words"
Issues = "https://github.com/garag0l/turkmen-num2words/issues"

[project.scripts]
tm-num = "turkmen_num2words.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.hatch.version]
path = "src/turkmen_num2words/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/turkmen_num2words"]

[tool.ruff]
line-length = 100
